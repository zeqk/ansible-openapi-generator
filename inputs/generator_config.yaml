
# =============================================================================
# Generator config for Databasus API
# Use with:  generate --config inputs/databasus_generator_config.yaml \
#                     --api-spec inputs/databasus_openapi.json
# =============================================================================

# --- Resolver anchors reutilizables ---
definitions:
  workspace_resolver: &workspace_resolver
    workspace:
      base: "workspaces"
      check_filter_key: "workspace_id"

collections:
  - namespace: zeqk
    name: databasus
    version: 1.0.0
    modules:

      # -----------------------------------------------------------------------
      # WORKSPACES — CRUD completo
      # -----------------------------------------------------------------------
      - name: workspace
        plugin: crud
        resource_type: "workspace"
        description: "Manage Databasus workspaces."
        base_operation_id: "workspaces"
        # Infiere automáticamente:
        #   check    -> workspaces_list
        #   create   -> workspaces_create
        #   update   -> workspaces_partial_update
        #   destroy  -> workspaces_destroy
        #   retrieve -> workspaces_retrieve

      - name: workspace_facts
        plugin: facts
        resource_type: "workspace"
        description: "Get facts about Databasus workspaces."
        base_operation_id: "workspaces"

      # -----------------------------------------------------------------------
      # DATABASES — CRUD con rutas no estándar para create/update
      # -----------------------------------------------------------------------
      - name: database
        plugin: crud
        resource_type: "database"
        description: "Manage Databasus databases."
        base_operation_id: "databases"
        operations:
          # La creación usa /databases/create en lugar de POST /databases
          create: "databases_create"
          # La actualización usa /databases/update en lugar de PATCH /databases/{id}
          update: "databases_partial_update"
          # destroy y check se infieren desde base_operation_id
        resolvers:
          <<: *workspace_resolver

      - name: database_facts
        plugin: facts
        resource_type: "database"
        description: "Get facts about Databasus databases."
        base_operation_id: "databases"
        resolvers:
          <<: *workspace_resolver

      # -----------------------------------------------------------------------
      # STORAGES — Sin endpoint de actualización
      # -----------------------------------------------------------------------
      - name: storage
        plugin: crud
        resource_type: "storage"
        description: "Manage Databasus backup storages."
        base_operation_id: "storages"
        operations:
          update: false   # La API no expone un endpoint de actualización
        resolvers:
          <<: *workspace_resolver

      - name: storage_facts
        plugin: facts
        resource_type: "storage"
        description: "Get facts about Databasus storages."
        base_operation_id: "storages"
        resolvers:
          <<: *workspace_resolver

      # -----------------------------------------------------------------------
      # NOTIFIERS — Sin endpoint de actualización
      # -----------------------------------------------------------------------
      - name: notifier
        plugin: crud
        resource_type: "notifier"
        description: "Manage Databasus notification channels."
        base_operation_id: "notifiers"
        operations:
          update: false   # La API no expone un endpoint de actualización
        resolvers:
          <<: *workspace_resolver

      - name: notifier_facts
        plugin: facts
        resource_type: "notifier"
        description: "Get facts about Databasus notifiers."
        base_operation_id: "notifiers"
        resolvers:
          <<: *workspace_resolver

      # -----------------------------------------------------------------------
      # USERS — Solo lectura (facts)
      # -----------------------------------------------------------------------
      - name: user_facts
        plugin: facts
        resource_type: "user"
        description: "Get facts about Databasus users."
        base_operation_id: "users"

      # -----------------------------------------------------------------------
      # VERIFICATION AGENTS — Crear y eliminar (sin retrieve ni update)
      # -----------------------------------------------------------------------
      - name: verification_agent
        plugin: crud
        resource_type: "verification agent"
        description: "Manage Databasus verification agents."
        base_operation_id: "verification_agents"
        operations:
          update: false   # No existe endpoint de actualización
          # No hay GET /verification/agents/{id}, pero sí DELETE

      - name: verification_agent_facts
        plugin: facts
        resource_type: "verification agent"
        description: "Get facts about Databasus verification agents."
        base_operation_id: "verification_agents"

      # -----------------------------------------------------------------------
      # BACKUPS — Crear, listar y eliminar
      # -----------------------------------------------------------------------
      - name: backup
        plugin: crud
        resource_type: "backup"
        description: "Manage Databasus logical backups."
        base_operation_id: "backups"
        operations:
          update: false   # Los backups no se actualizan
        resolvers:
          database:
            base: "databases"
            check_filter_key: "database_id"

      - name: backup_facts
        plugin: facts
        resource_type: "backup"
        description: "Get facts about Databasus backups."
        base_operation_id: "backups"
        resolvers:
          database:
            base: "databases"
            check_filter_key: "database_id"
